<svg xmlns="http://www.w3.org/2000/svg" width="360" height="704" viewBox="0 0 360 704">
  <rect width="360" height="704" fill="#FFFFFF"/>

  <g id="scroll_content">
    <g id="header">
      <text x="16" y="34" font-family="YS Text, Arial, sans-serif" font-size="22" font-weight="500" fill="#000000">Добавление издержки</text>
      <rect x="272" y="14" width="72" height="28" rx="10" fill="#F5F5F5"/>
      <text x="308" y="33" text-anchor="middle" font-family="YS Text, Arial, sans-serif" font-size="12" font-weight="500" fill="#000000">Черновик</text>
    </g>

    <g id="media">
      <g id="image_input">
        <text x="16" y="62" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Изображение</text>
        <rect x="16" y="70" width="328" height="70" rx="12" fill="#F5F5F5" stroke="#CED8E1"/>

        <g id="current_image_preview">
          <rect x="28" y="81" width="48" height="48" rx="8" fill="#FFFFFF" stroke="#CED8E1"/>
          <rect x="35" y="88" width="17" height="32" rx="3" fill="#D8D8D8"/>
          <rect x="55" y="92" width="7" height="28" rx="2" fill="#FFFFFF" stroke="#CED8E1"/>
          <rect x="65" y="86" width="6" height="34" rx="2" fill="#FFFFFF" stroke="#CED8E1"/>
          <path d="M57 101 H60 M67 96 H70" stroke="#7D858C" stroke-width="1.2"/>
        </g>

        <text x="88" y="91" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">Текущее: sugar_sticks.jpg</text>
        <g id="choose_new_image">
          <rect x="88" y="100" width="116" height="28" rx="8" fill="#FFFFFF" stroke="#CED8E1"/>
          <text x="146" y="118" text-anchor="middle" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#000000">Выбрать файл</text>
        </g>
        <text x="216" y="118" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">Новый не выбран</text>
      </g>

      <g id="video_input">
        <text x="16" y="158" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Видео</text>
        <rect x="16" y="166" width="328" height="70" rx="12" fill="#F5F5F5" stroke="#CED8E1"/>

        <g id="current_video_preview">
          <rect x="28" y="177" width="48" height="48" rx="8" fill="#33383C"/>
          <rect x="39" y="181" width="26" height="40" rx="5" fill="#727678"/>
          <path d="M48 191 L48 211 L59 201 Z" fill="#FFFFFF"/>
        </g>

        <text x="88" y="187" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">Текущее: sugar_sticks.mp4</text>
        <g id="choose_new_video">
          <rect x="88" y="196" width="116" height="28" rx="8" fill="#FFFFFF" stroke="#CED8E1"/>
          <text x="146" y="214" text-anchor="middle" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#000000">Выбрать файл</text>
        </g>
        <text x="216" y="214" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">Новый не выбран</text>
      </g>
    </g>

    <g id="form_fields">
      <g id="field_name">
        <text x="16" y="254" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Название</text>
        <rect x="16" y="262" width="328" height="40" rx="12" fill="#F5F5F5"/>
        <text x="30" y="287" font-family="YS Text, Arial, sans-serif" font-size="14" fill="#000000">Порционный сахар</text>
      </g>

      <g id="field_description">
        <text x="16" y="320" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Описание</text>
        <rect x="16" y="328" width="328" height="54" rx="12" fill="#F5F5F5"/>
        <text x="30" y="350" font-family="YS Text, Arial, sans-serif" font-size="13" fill="#000000">Сахар в стиках 5 г, арт. 7234.</text>
        <text x="30" y="369" font-family="YS Text, Arial, sans-serif" font-size="13" fill="#000000">Учебная норма: 1 стик на напиток.</text>
      </g>

      <g id="field_behavior">
        <text x="16" y="400" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Вид издержек</text>
        <rect x="16" y="408" width="328" height="40" rx="12" fill="#F5F5F5"/>
        <text x="30" y="433" font-family="YS Text, Arial, sans-serif" font-size="14" fill="#000000">Переменные</text>
        <path d="M316 423 l6 6 l6 -6" fill="none" stroke="#7D858C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </g>

      <g id="field_monthly_cost">
        <text x="16" y="466" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Расходы за месяц, ₽</text>
        <rect x="16" y="474" width="328" height="40" rx="12" fill="#F5F5F5"/>
        <text x="30" y="499" font-family="YS Text, Arial, sans-serif" font-size="14" fill="#000000">830,00</text>
      </g>
    </g>

    <g id="draft_metadata">
      <text x="16" y="535" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">База: 1000 напитков/мес.</text>
      <text x="16" y="554" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#000000">Источник: barista-ltd.ru</text>
      <text x="344" y="554" text-anchor="end" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">08.09.2026</text>

      <g id="draft_likes">
        <path d="M16 568 C16 562 24 561 27 566 C30 561 38 562 38 568 C38 576 27 582 27 582 C27 582 16 576 16 568 Z" fill="none" stroke="#7D858C" stroke-width="1.6"/>
        <text x="46" y="577" font-family="YS Text, Arial, sans-serif" font-size="13" fill="#7D858C">0</text>
      </g>
    </g>

    <g id="publish_disabled">
      <rect x="16" y="584" width="328" height="44" rx="12" fill="#CED8E1"/>
      <text x="180" y="611" text-anchor="middle" font-family="YS Text, Arial, sans-serif" font-size="14" fill="#7D858C">Опубликовать</text>
      <text x="180" y="637" text-anchor="middle" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Изменения не сохраняются</text>
    </g>
  </g>

  <g id="navigation">
    <rect x="0" y="640" width="360" height="64" fill="#FFFFFF"/>
    <line x1="0" y1="640.5" x2="360" y2="640.5" stroke="#CED8E1"/>
    <text x="60" y="678" text-anchor="middle" font-family="YS Text, Arial, sans-serif" font-size="13" fill="#7D858C">Лента</text>
    <rect x="128" y="650" width="104" height="44" rx="12" fill="#000000"/>
    <text x="180" y="678" text-anchor="middle" font-family="YS Text, Arial, sans-serif" font-size="13" font-weight="500" fill="#FFFFFF">Добавление</text>
    <text x="300" y="678" text-anchor="middle" font-family="YS Text, Arial, sans-serif" font-size="13" fill="#7D858C">Плитка</text>
  </g>
</svg>
