{% extends "cost_base.html" %}
{% block title %}Добавление издержки — Масштаб{% endblock %}
{% block content %}
<section class="draft-screen" aria-label="Добавление издержки">
{% if draft %}
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <rect width="360" height="704" fill="#FFFFFF"/>
  <g id="header">
    <text x="16" y="34" font-family="YS Text, Arial, sans-serif" font-size="22" font-weight="500" fill="#000000">Добавление издержки</text>
    <rect x="272" y="14" width="72" height="28" rx="10" fill="#F5F5F5"/>
  </g>

  <g id="media">
    <g id="image_input">
      <text x="16" y="62" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Изображение</text>
      <rect x="16" y="72" width="328" height="64" rx="12" fill="#F5F5F5" stroke="#CED8E1"/>
      <rect x="28" y="90" width="116" height="28" rx="8" fill="#FFFFFF" stroke="#CED8E1"/>


    </g>

    <g id="video_input">
      <text x="16" y="160" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Видео</text>
      <rect x="16" y="170" width="328" height="64" rx="12" fill="#F5F5F5" stroke="#CED8E1"/>
      <rect x="28" y="188" width="116" height="28" rx="8" fill="#FFFFFF" stroke="#CED8E1"/>


    </g>
  </g>

  <g id="form">
    <text x="16" y="258" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Название</text>
    <rect x="16" y="266" width="328" height="44" rx="12" fill="#F5F5F5"/>


    <text x="16" y="334" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Описание</text>
    <rect x="16" y="342" width="328" height="58" rx="12" fill="#F5F5F5"/>



    <text x="16" y="423" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Вид издержек</text>
    <rect x="16" y="431" width="328" height="44" rx="12" fill="#F5F5F5"/>

    <path d="M316 448 l6 6 l6 -6" fill="none" stroke="#7D858C" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>

    <text x="16" y="498" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Расходы за месяц, ₽</text>
    <rect x="16" y="506" width="328" height="44" rx="12" fill="#F5F5F5"/>


    <rect x="16" y="575" width="328" height="44" rx="12" fill="#CED8E1"/>

  </g>

</svg>
<label class="upload upload-image"><span class="visually-hidden">Изображение</span><input type="file" accept="image/png,image/jpeg" name="cost_image"></label>
<a href="{{ draft.cost_image_url }}" target="_blank" rel="noopener noreferrer" aria-label="Открыть изображение черновика"><img class="draft-media draft-media-image" src="{{ draft.cost_image_url }}" alt="{{ draft.cost_name }}" width="48" height="48"></a>
<a href="{{ draft.cost_video_url }}" target="_blank" rel="noopener noreferrer" aria-label="Открыть видео черновика"><video class="draft-media draft-media-video" poster="{{ draft.cost_image_url }}" autoplay muted loop playsinline><source src="{{ draft.cost_video_url }}" type="video/mp4"></video></a>
<label class="upload upload-video"><span class="visually-hidden">Видео</span><input type="file" accept="video/mp4" name="cost_video"></label>
<input class="draft-control draft-name" aria-label="Название" name="cost_name" value="{{ draft.cost_name }}">
<textarea class="draft-control draft-description" aria-label="Описание" name="cost_description">{% if draft.cost_id == 7 %}Сахар в стиках 5 г, арт. 7234.
Учебная норма: 1 стик на напиток.{% else %}{{ draft.cost_description }}{% endif %}</textarea>
<select class="draft-control draft-behavior" aria-label="Вид издержек" name="cost_behavior">
<option value="fixed"{% if draft.cost_behavior == 'fixed' %} selected{% endif %}>Постоянные</option>
<option value="variable"{% if draft.cost_behavior == 'variable' %} selected{% endif %}>Переменные</option>
</select>
<input class="draft-control draft-amount" aria-label="Расходы за месяц, ₽" name="monthly_cost_rub" inputmode="decimal" value="{{ draft.monthly_cost_display }}">
<button class="publish-button" type="button" disabled>Опубликовать</button>
{% else %}<div class="screen-message">{{ empty_message }}</div>{% endif %}
</section>
{% endblock %}
