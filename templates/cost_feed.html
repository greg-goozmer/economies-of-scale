{% extends "cost_base.html" %}
{% block title %}Лента издержек — Масштаб{% endblock %}
{% block content %}
<section class="feed-screen" aria-label="Лента издержек">
{% if error_message or empty_message %}
<div class="screen-message" role="status"><p>{{ error_message or empty_message }}</p>{% if show_tiles_link %}<a href="/costs">Перейти к плитке</a>{% endif %}</div>
{% elif cost %}
<video class="feed-video" autoplay muted loop playsinline poster="{{ cost.cost_image_url }}" aria-label="Видео: {{ cost.cost_name }}"><source src="{{ cost.cost_video_url }}" type="video/mp4"></video>
<div class="feed-shade" aria-hidden="true"></div>
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640" class="feed-info"><g id="info">
    <text x="16" y="526" font-family="YS Text, Arial, sans-serif" font-size="18" font-weight="500" fill="#FFFFFF">{{ cost.cost_name }}</text>
    <text x="16" y="548" font-family="YS Text, Arial, sans-serif" font-size="13" fill="#FFFFFF">{% if cost.cost_id == 1 %}Платная аренда Dr.coffee F10.{% else %}{{ cost.cost_description[:35] }}{% endif %}</text>
    <text x="16" y="569" font-family="YS Text, Arial, sans-serif" font-size="13" fill="#FFFFFF">{% if cost.cost_id == 1 %}Одна машина - 9 900 ₽ в месяц.{% else %}{{ cost.cost_description[35:70] }}{% endif %}</text>

    <g id="likes">
      <path d="M296 551 C296 543 307 542 311 549 C315 542 326 543 326 551 C326 561 311 570 311 570 C311 570 296 561 296 551 Z" fill="none" stroke="#FFFFFF" stroke-width="1.8"/>
      <text x="334" y="562" font-family="YS Text, Arial, sans-serif" font-size="13" fill="#FFFFFF">{{ cost.like_count }}</text>
    </g>

    <a id="arrow_down" href="{{ next_url }}" aria-label="Следующая">
      <rect x="296" y="579" width="28" height="28" rx="4" fill="#FFFFFF"/>
      <path d="M310 600 L316 593 H312 V587 H308 V593 H304 Z" fill="#000000"/>
    </a>

    <g id="info_behavior">
      <rect x="8" y="584" width="114" height="48" rx="12" fill="#FFFFFF"/>
      <text x="20" y="603" font-family="YS Text, Arial, sans-serif" font-size="10.5" fill="#7D858C">Вид издержек</text>
      <text x="20" y="622" font-family="YS Text, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000">{{ cost.cost_behavior_display }}</text>
    </g>

    <g id="info_cost">
      <rect x="130" y="584" width="114" height="48" rx="12" fill="#FFFFFF"/>
      <text x="142" y="603" font-family="YS Text, Arial, sans-serif" font-size="10.5" fill="#7D858C">Расходы</text>
      <text x="142" y="622" font-family="YS Text, Arial, sans-serif" font-size="13" font-weight="500" fill="#000000">{{ cost.monthly_cost_display[:-3] if cost.monthly_cost_display.endswith(',00') else cost.monthly_cost_display }} ₽/мес.</text>
    </g>
  </g>

</svg>
{% endif %}
</section>
{% endblock %}
