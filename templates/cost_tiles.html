{% extends "cost_base.html" %}
{% block title %}Издержки кофейного уголка — Масштаб{% endblock %}
{% block content %}
<section class="tiles-screen" aria-label="Издержки кофейного уголка">
<svg xmlns="http://www.w3.org/2000/svg" width="360" height="640" viewBox="0 0 360 640">
  <rect width="360" height="704" fill="#FFFFFF"/>
  <g id="header">
    <text x="16" y="34" font-family="YS Text, Arial, sans-serif" font-size="21" font-weight="500" fill="#000000">Издержки кофейного уголка</text>
  </g>

  <g id="filter">
    <text x="16" y="66" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#7D858C">Расходы за месяц до, ₽</text>
    <rect x="16" y="74" width="208" height="44" rx="12" fill="#F5F5F5"/>

    <rect x="228" y="74" width="116" height="44" rx="12" fill="#000000"/>

    <text x="16" y="140" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#000000">Найдено: {{ costs|length }}</text>
    <a href="/costs" aria-label="Сбросить фильтр"><text x="344" y="140" text-anchor="end" font-family="YS Text, Arial, sans-serif" font-size="12" fill="#000000">Сбросить</text></a>
  </g>


<g id="cards">{% for cost in costs %}<a href="/costs/feed?cost_id={{ cost.cost_id }}" aria-label="{{ cost.cost_name }}">{% if cost.cost_id == 1 %}<g transform="translate({{ 16 + (loop.index0 % 2) * 170 - 16 }} {{ 156 + (loop.index0 // 2) * 146 - 156 }})">
      <rect x="16" y="156" width="158" height="134" rx="12" fill="#FFFFFF" stroke="#CED8E1"/>
      <path d="M16 168 Q16 156 28 156 H162 Q174 156 174 168 V222 H16 Z" fill="#F5F5F5"/>
      <defs><clipPath id="media-{{ cost.cost_id }}"><path d="M16 168 Q16 156 28 156 H162 Q174 156 174 168 V222 H16 Z"/></clipPath></defs>
      <image href="{{ cost.cost_image_url }}" x="16" y="156" width="158" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#media-{{ cost.cost_id }})"/>
      <text x="26" y="240" font-family="YS Text, Arial, sans-serif" font-size="12.2" font-weight="500">{{ cost.cost_name.rsplit(" ", 1)[0] }}</text>
      <text x="26" y="255" font-family="YS Text, Arial, sans-serif" font-size="12.2" font-weight="500">{{ cost.cost_name.rsplit(" ", 1)[-1] }}</text>
      <text x="26" y="273" font-family="YS Text, Arial, sans-serif" font-size="11.5" fill="#7D858C">{{ cost.monthly_cost_display[:-3] if cost.monthly_cost_display.endswith(',00') else cost.monthly_cost_display }} ₽/мес.</text>
      <path d="M128 271 C128 266 135 265 138 270 C141 265 148 266 148 271 C148 278 138 283 138 283 C138 283 128 278 128 271 Z" fill="none" stroke="#7D858C" stroke-width="1.3"/>
      <text x="155" y="278" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">{{ cost.like_count }}</text>
    </g>
{% elif cost.cost_id == 2 %}<g transform="translate({{ 16 + (loop.index0 % 2) * 170 - 186 }} {{ 156 + (loop.index0 // 2) * 146 - 156 }})">
      <rect x="186" y="156" width="158" height="134" rx="12" fill="#FFFFFF" stroke="#CED8E1"/>
      <path d="M186 168 Q186 156 198 156 H332 Q344 156 344 168 V222 H186 Z" fill="#F5F5F5"/>
      <defs><clipPath id="media-{{ cost.cost_id }}"><path d="M186 168 Q186 156 198 156 H332 Q344 156 344 168 V222 H186 Z"/></clipPath></defs>
      <image href="{{ cost.cost_image_url }}" x="186" y="156" width="158" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#media-{{ cost.cost_id }})"/>
      <text x="196" y="240" font-family="YS Text, Arial, sans-serif" font-size="12.2" font-weight="500">{{ cost.cost_name.rsplit(" ", 1)[0] }}</text>
      <text x="196" y="255" font-family="YS Text, Arial, sans-serif" font-size="12.2" font-weight="500">{{ cost.cost_name.rsplit(" ", 1)[-1] }}</text>
      <text x="196" y="273" font-family="YS Text, Arial, sans-serif" font-size="11.5" fill="#7D858C">{{ cost.monthly_cost_display[:-3] if cost.monthly_cost_display.endswith(',00') else cost.monthly_cost_display }} ₽/мес.</text>
      <path d="M298 271 C298 266 305 265 308 270 C311 265 318 266 318 271 C318 278 308 283 308 283 C308 283 298 278 298 271 Z" fill="none" stroke="#7D858C" stroke-width="1.3"/>
      <text x="325" y="278" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">{{ cost.like_count }}</text>
    </g>
{% elif cost.cost_id == 3 %}<g transform="translate({{ 16 + (loop.index0 % 2) * 170 - 16 }} {{ 156 + (loop.index0 // 2) * 146 - 302 }})">
      <rect x="16" y="302" width="158" height="134" rx="12" fill="#FFFFFF" stroke="#CED8E1"/>
      <path d="M16 314 Q16 302 28 302 H162 Q174 302 174 314 V368 H16 Z" fill="#F5F5F5"/>
      <defs><clipPath id="media-{{ cost.cost_id }}"><path d="M16 314 Q16 302 28 302 H162 Q174 302 174 314 V368 H16 Z"/></clipPath></defs>
      <image href="{{ cost.cost_image_url }}" x="16" y="302" width="158" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#media-{{ cost.cost_id }})"/>
      <text x="26" y="390" font-family="YS Text, Arial, sans-serif" font-size="12.5" font-weight="500">{{ cost.cost_name }}</text>
      <text x="26" y="411" font-family="YS Text, Arial, sans-serif" font-size="11.5" fill="#7D858C">{{ cost.monthly_cost_display[:-3] if cost.monthly_cost_display.endswith(',00') else cost.monthly_cost_display }} ₽/мес.</text>
      <path d="M128 417 C128 412 135 411 138 416 C141 411 148 412 148 417 C148 424 138 429 138 429 C138 429 128 424 128 417 Z" fill="none" stroke="#7D858C" stroke-width="1.3"/>
      <text x="155" y="424" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">{{ cost.like_count }}</text>
    </g>
{% elif cost.cost_id == 4 %}<g transform="translate({{ 16 + (loop.index0 % 2) * 170 - 186 }} {{ 156 + (loop.index0 // 2) * 146 - 302 }})">
      <rect x="186" y="302" width="158" height="134" rx="12" fill="#FFFFFF" stroke="#CED8E1"/>
      <path d="M186 314 Q186 302 198 302 H332 Q344 302 344 314 V368 H186 Z" fill="#F5F5F5"/>
      <defs><clipPath id="media-{{ cost.cost_id }}"><path d="M186 314 Q186 302 198 302 H332 Q344 302 344 314 V368 H186 Z"/></clipPath></defs>
      <image href="{{ cost.cost_image_url }}" x="186" y="302" width="158" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#media-{{ cost.cost_id }})"/>
      <text x="196" y="390" font-family="YS Text, Arial, sans-serif" font-size="12.5" font-weight="500">{{ cost.cost_name }}</text>
      <text x="196" y="411" font-family="YS Text, Arial, sans-serif" font-size="11.5" fill="#7D858C">{{ cost.monthly_cost_display[:-3] if cost.monthly_cost_display.endswith(',00') else cost.monthly_cost_display }} ₽/мес.</text>
      <path d="M298 417 C298 412 305 411 308 416 C311 411 318 412 318 417 C318 424 308 429 308 429 C308 429 298 424 298 417 Z" fill="none" stroke="#7D858C" stroke-width="1.3"/>
      <text x="325" y="424" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">{{ cost.like_count }}</text>
    </g>
{% elif cost.cost_id == 5 %}<g transform="translate({{ 16 + (loop.index0 % 2) * 170 - 16 }} {{ 156 + (loop.index0 // 2) * 146 - 448 }})">
      <rect x="16" y="448" width="158" height="134" rx="12" fill="#FFFFFF" stroke="#CED8E1"/>
      <path d="M16 460 Q16 448 28 448 H162 Q174 448 174 460 V514 H16 Z" fill="#F5F5F5"/>
      <defs><clipPath id="media-{{ cost.cost_id }}"><path d="M16 460 Q16 448 28 448 H162 Q174 448 174 460 V514 H16 Z"/></clipPath></defs>
      <image href="{{ cost.cost_image_url }}" x="16" y="448" width="158" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#media-{{ cost.cost_id }})"/>
      <text x="26" y="532" font-family="YS Text, Arial, sans-serif" font-size="12.2" font-weight="500">{{ cost.cost_name.rsplit(" ", 1)[0] }}</text>
      <text x="26" y="547" font-family="YS Text, Arial, sans-serif" font-size="12.2" font-weight="500">{{ cost.cost_name.rsplit(" ", 1)[-1] }}</text>
      <text x="26" y="565" font-family="YS Text, Arial, sans-serif" font-size="11.5" fill="#7D858C">{{ cost.monthly_cost_display[:-3] if cost.monthly_cost_display.endswith(',00') else cost.monthly_cost_display }} ₽/мес.</text>
      <path d="M128 563 C128 558 135 557 138 562 C141 557 148 558 148 563 C148 570 138 575 138 575 C138 575 128 570 128 563 Z" fill="none" stroke="#7D858C" stroke-width="1.3"/>
      <text x="155" y="570" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">{{ cost.like_count }}</text>
    </g>
{% elif cost.cost_id == 6 %}<g transform="translate({{ 16 + (loop.index0 % 2) * 170 - 186 }} {{ 156 + (loop.index0 // 2) * 146 - 448 }})">
      <rect x="186" y="448" width="158" height="134" rx="12" fill="#FFFFFF" stroke="#CED8E1"/>
      <path d="M186 460 Q186 448 198 448 H332 Q344 448 344 460 V514 H186 Z" fill="#F5F5F5"/>
      <defs><clipPath id="media-{{ cost.cost_id }}"><path d="M186 460 Q186 448 198 448 H332 Q344 448 344 460 V514 H186 Z"/></clipPath></defs>
      <image href="{{ cost.cost_image_url }}" x="186" y="448" width="158" height="66" preserveAspectRatio="xMidYMid slice" clip-path="url(#media-{{ cost.cost_id }})"/>
      <text x="196" y="532" font-family="YS Text, Arial, sans-serif" font-size="12.2" font-weight="500">{{ cost.cost_name.rsplit(" ", 1)[0] }}</text>
      <text x="196" y="547" font-family="YS Text, Arial, sans-serif" font-size="12.2" font-weight="500">{{ cost.cost_name.rsplit(" ", 1)[-1] }}</text>
      <text x="196" y="565" font-family="YS Text, Arial, sans-serif" font-size="11.5" fill="#7D858C">{{ cost.monthly_cost_display[:-3] if cost.monthly_cost_display.endswith(',00') else cost.monthly_cost_display }} ₽/мес.</text>
      <path d="M298 563 C298 558 305 557 308 562 C311 557 318 558 318 563 C318 570 308 575 308 575 C308 575 298 570 298 563 Z" fill="none" stroke="#7D858C" stroke-width="1.3"/>
      <text x="325" y="570" font-family="YS Text, Arial, sans-serif" font-size="11" fill="#7D858C">{{ cost.like_count }}</text>
    </g>
{% endif %}</a>{% endfor %}</g>
</svg>
<form class="cost-filter" method="get" action="/costs">
<input aria-label="Расходы за месяц до, ₽" name="max_monthly_cost" inputmode="decimal" value="{{ filter_value }}" placeholder="Введите сумму">
<button type="submit">Показать</button>
</form>
{% if error_message %}<p class="validation-error" role="alert">{{ error_message }}</p>
{% elif filter_applied and not costs %}<p class="empty-result">По заданному порогу издержки не найдены</p>{% endif %}
</section>
{% endblock %}
